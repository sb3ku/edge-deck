<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Edge Deck</title>
  <!-- An ultra-wide touchscreen (the XENEON EDGE) showing dashboard tiles:
       music (violet), printer progress (green) and weather (amber). Simple
       shapes so the mark still reads at 16 px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242a3a"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ab0ff"/>
      <stop offset=".55" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <linearGradient id="music" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ab0ff"/>
      <stop offset="1" stop-color="#8b6cff"/>
    </linearGradient>
    <linearGradient id="weather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcc4d"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7d8bff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7d8bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="244" height="244" rx="58" fill="url(#bg)"/>
  <rect x="7" y="7" width="242" height="242" rx="57" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <!-- Light from the screen on the desk. -->
  <ellipse cx="128" cy="176" rx="104" ry="34" fill="url(#glow)"/>
  <!-- The ultra-wide screen: bezel with a glowing edge. -->
  <rect x="22" y="82" width="212" height="92" rx="18" fill="#07090e"/>
  <rect x="22" y="82" width="212" height="92" rx="18" fill="none" stroke="url(#screen)" stroke-width="5"/>
  <!-- Tiles: music, printer progress, weather. -->
  <rect x="36" y="96" width="78" height="64" rx="10" fill="url(#music)"/>
  <circle cx="60" cy="128" r="9" fill="#ffffff" fill-opacity=".9"/>
  <rect x="124" y="96" width="46" height="64" rx="10" fill="#1c2b22"/>
  <rect x="131" y="138" width="32" height="10" rx="5" fill="#30d158"/>
  <rect x="131" y="108" width="20" height="20" rx="4" fill="#30d158" fill-opacity=".55"/>
  <rect x="180" y="96" width="40" height="64" rx="10" fill="url(#weather)"/>
  <circle cx="200" cy="118" r="9" fill="#fff6d8"/>
  <!-- Stand. -->
  <rect x="116" y="174" width="24" height="14" rx="3" fill="#2b3142"/>
  <rect x="92" y="186" width="72" height="8" rx="4" fill="#3a4157"/>
</svg>
