    (function () {
      const pct = document.querySelector("#s4-pct");
      const layers = document.querySelector("#s4-layers");
      const job = { p: 0.63 };
      function show() {
        const p = job.p;
        pct.textContent = Math.round(p * 100) + "%";
        const done = Math.min(186, Math.round(186 * p));
        const mins = Math.max(0, Math.round((48 * (1 - p)) / 0.37));

      const tl = gsap.timeline({ paused: true });

      // The print runs 63% → 100%: number, layers and bar from one value.

      tl.fromTo("#s4-fill", { scaleX: 0.63 }, { scaleX: 1, duration: 1.45, ease: "power2.inOut" }, 0.55);

      // Finished at 14.68 s (local 2.03): status and phase flip to green.

      // Caption: 4 words, settled ~0.85 → 3.4 (~2.5 s).
