  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      // Codex orb: dots on a sphere (golden-angle spiral), turned by the timeline.
      const codex = document.querySelector("#s3-orb-codex");
      const dots = [];
      const N = 70;
      for (let i = 0; i < N; i++) {
        const y = 1 - (i / (N - 1)) * 2;
        const r = Math.sqrt(1 - y * y);
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("fill", "#10a37f");
        codex.appendChild(c);
        dots.push({ el: c, y, r, a: i * 2.39996 });
      }
      // Claude orb: meridian rings of a sphere, turned by the timeline.
      const claude = document.querySelector("#s3-orb-claude");
      const rings = [];
      for (let i = 0; i < 9; i++) {
        const e = document.createElementNS(NS, "ellipse");
        e.setAttribute("cx", 0); e.setAttribute("cy", 0); e.setAttribute("ry", 40);
        e.setAttribute("fill", "none"); e.setAttribute("stroke", "#d97757"); e.setAttribute("stroke-width", 2.2);
        claude.appendChild(e);
        rings.push({ el: e, phase: (i / 9) * Math.PI });
      }
      function drawOrbs(t) {
        const turn = t * 0.9;
        dots.forEach((d) => {
          const a = d.a + turn;
          const x = Math.cos(a) * d.r * 40, z = Math.sin(a) * d.r;
          d.el.setAttribute("cx", x.toFixed(2));
          d.el.setAttribute("cy", (-d.y * 40).toFixed(2));
          d.el.setAttribute("r", (1.4 + 1.3 * (z + 1) / 2).toFixed(2));
          d.el.setAttribute("opacity", (0.25 + 0.75 * (z + 1) / 2).toFixed(2));
        });
        rings.forEach((g) => {
          const c = Math.cos(g.phase + turn);
          g.el.setAttribute("rx", Math.abs(c * 40).toFixed(2));
          g.el.setAttribute("opacity", (0.35 + 0.65 * Math.abs(Math.sin(g.phase + turn))).toFixed(2));
        });
      }
      const timer = document.querySelector("#s3-timer");
      const clock = { t: 0 };
      function tick() {
        drawOrbs(clock.t);
        timer.textContent = "5m " + (2 + Math.floor(clock.t)) + "s";
      }
      tick();

      const tl = gsap.timeline({ paused: true });
      // Seek-safe continuous motion: orbs turn and the timer counts with timeline time.
      tl.fromTo(clock, { t: 0 }, { t: 3.69, duration: 3.69, ease: "none", onUpdate: tick }, 0);
      tl.fromTo(["#s3-spin1", "#s3-spin2"], { rotation: 0 }, { rotation: 1440, duration: 3.69, ease: "none" }, 0);

      // Carried in from the deck's push-in: arrives blurred and slightly right, settles.
      tl.fromTo("#s3-card", { x: 257, scale: 1.06, filter: "blur(10px)", opacity: 0.6 },
        { x: 0, scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.55, ease: "expo.out" }, 0);

      // beat-grid: checkmarks on every other beat, 10.01 s and 11.06 s (local 1.05, 2.10)
      [[1.05, 1], [2.1, 2]].forEach(([at, n]) => {
        tl.fromTo("#s3-spin" + n, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.out" }, at);
        tl.fromTo("#s3-done" + n, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, at);
        tl.fromTo("#s3-label" + n, { color: "rgb(245,245,247)" }, { color: "rgba(235,235,245,0.62)", duration: 0.3, ease: "power2.out" }, at);
      });

      // Caption: per word from blur; 6 words, settled ~0.95 → 3.36 (~2.4 s).
      gsap.utils.toArray("#s3-caption span").forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out" }, 0.45 + i * 0.08);
      });
      // Exit: a whip left into the printers scene.
      tl.to("#s3-caption", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, 3.36);
      tl.to("#s3-card", { x: -320, opacity: 0, filter: "blur(12px)", duration: 0.3, ease: "power3.in" }, 3.38);
      window.__timelines["agents"] = tl;
    })();
  </script>
